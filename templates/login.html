<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MealMatch</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .login-error {
            color: #dc2626;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
        }

        /* =========================================
   PREMIUM MEALMATCH LOGIN QUOTE
========================================= */

        .auth-navbar .login-brand-quote {
            position: relative;
            display: inline-block;

            color: #236B3A;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            line-height: 1.8;

            padding: 0 0 7px;

            cursor: default;

            animation: quoteFadeIn 0.9s ease-out both;

            transition:
                color 0.3s ease,
                letter-spacing 0.3s ease,
                transform 0.3s ease;
        }


        /* ELEGANT GRADIENT UNDERLINE */

        .auth-navbar .login-brand-quote::after {
            content: "";

            position: absolute;
            left: 0;
            bottom: 0;

            width: 100%;
            height: 2px;

            background: linear-gradient(90deg,
                    #236B3A,
                    #77B77D,
                    #C1DFC2);

            border-radius: 10px;

            transform: scaleX(0);
            transform-origin: left center;

            animation: quoteUnderline 0.8s ease-out 0.5s forwards;

            transition:
                height 0.3s ease,
                box-shadow 0.3s ease;
        }


        /* SUBTLE HOVER EFFECT */

        .auth-navbar .login-brand-quote:hover {
            color: #184F2B;
            letter-spacing: 0.7px;
            transform: translateY(-2px);
        }

        .auth-navbar .login-brand-quote:hover::after {
            height: 3px;
            box-shadow: 0 2px 8px rgba(35, 107, 58, 0.22);
        }


        /* QUOTE ENTRANCE ANIMATION */

        @keyframes quoteFadeIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* UNDERLINE REVEAL ANIMATION */

        @keyframes quoteUnderline {
            from {
                transform: scaleX(0);
            }

            to {
                transform: scaleX(1);
            }
        }


        /* SMALL SCREENS */

        @media (max-width: 600px) {
            .auth-navbar .login-brand-quote {
                font-size: 12px;
                letter-spacing: 0.2px;
            }
        }


        /* ACCESSIBILITY: REDUCE ANIMATION WHEN REQUESTED */

        @media (prefers-reduced-motion: reduce) {
            .auth-navbar .login-brand-quote {
                animation: none;
            }

            .auth-navbar .login-brand-quote::after {
                animation: none;
                transform: scaleX(1);
            }

            .auth-navbar .login-brand-quote,
            .auth-navbar .login-brand-quote::after {
                transition: none;
            }
        }
    </style>

</head>

<body>
    <header class="navbar auth-navbar">
        <h1>
            <img src="{{ url_for('static', filename='mealmatch-logo-transparent.png') }}" alt="MealMatch">
        </h1>
        <span class="login-brand-quote">
            Good food. Better connections.
        </span>
    </header>

    <main class="login-container">
        <div class="login-card">
            <p class="tagline">WELCOME TO MEALMATCH</p>
            <h2>Welcome back!</h2>
            <p>Sign in to connect with your community.</p>

            {% if error %}
            <p class="login-error">{{ error }}</p>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST">
                <label for="identifier">Email Address or Phone Number</label>
                <input type="text" id="identifier" name="identifier" placeholder="Enter your email or phone number"
                    autocomplete="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password"
                    autocomplete="current-password" required>

                <button type="submit">Login</button>
                <p><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
            </form>

            <p class="signup-text">
                New to MealMatch?
                <a href="{{ url_for('register') }}">Create an account</a>
            </p>

            <p>
                <a href="/">Back to Home</a>
            </p>
        </div>
    </main>
</body>

</html>
